name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Folder android/ dibuat otomatis jika belum ada (tanpa Android Studio)
      - name: Generate platform android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name kalkulator_bmi
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kalkulator-bmi-apk
          path: build/app/outputs/flutter-apk/app-release.apk